name: stale

# Nudges PRs and issues that have gone quiet. Nothing is closed here — the bot
# only comments, labels and (eventually) closes after a second grace period, so
# a maintainer can always reopen.
on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be marked stale or closed, change nothing"
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 21
          stale-pr-message: >
            No activity for 60 days. Comment to keep this open; it will be
            closed in 21 days otherwise.
          stale-issue-message: >
            No activity for 60 days. Comment to keep this open; it will be
            closed in 21 days otherwise.
          close-pr-message: Closing for inactivity — reopen any time.
          close-issue-message: Closing for inactivity — reopen any time.
          exempt-issue-labels: pinned,security,live-smoke-drift
          exempt-pr-labels: pinned,security
          exempt-all-milestones: true
          # Empty on the weekly schedule (acts for real); a dispatch defaults to
          # a dry run so a manual test never touches anything.
          debug-only: ${{ inputs.dry-run }}
