name: stale

# Nudges PRs and issues that have gone quiet. Nothing is closed here — the bot
# only comments, labels and (eventually) closes after a second grace period, so
# a maintainer can always reopen.
on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Mondays 07:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 60
          days-before-close: 21
          stale-pr-message: >
            No activity for 60 days. Comment to keep this open; it will be
            closed in 21 days otherwise.
          stale-issue-message: >
            No activity for 60 days. Comment to keep this open; it will be
            closed in 21 days otherwise.
          close-pr-message: Closing for inactivity — reopen any time.
          close-issue-message: Closing for inactivity — reopen any time.
          exempt-issue-labels: pinned,security,live-smoke-drift
          exempt-pr-labels: pinned,security
          exempt-all-milestones: true
