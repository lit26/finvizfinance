name: publish

# Publish to PyPI via Trusted Publishing (OIDC) — no stored API token.
# The GitHub Release is the human "ship it" gate; a manual dispatch is kept
# for re-runs. Requires a one-time PyPI pending-publisher registration:
#   publisher: GitHub Actions | owner: lit26 | repo: finvizfinance
#   workflow: publish.yml | environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to PyPI (a dispatch otherwise only builds and verifies)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Verify the downloaded artifacts
        run: |
          python -m pip install --upgrade twine
          ls -l dist/
          python -m twine check dist/*
      # A manual dispatch defaults to build + verify only, so the artifact path
      # can be exercised without publishing anything.
      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
