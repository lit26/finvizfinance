[pytest]
# Put the repo root on sys.path so `import finvizfinance` works under a bare
# `pytest` invocation (CI runs `pytest tests`). Previously this was provided
# implicitly by an empty tests/__init__.py; the offline harness makes tests/ a
# non-package (so `from conftest import ...` resolves), so set it explicitly.
pythonpath = .
testpaths = tests
markers =
    live: real-network test against finviz; skipped unless --run-live or RUN_LIVE=1 (see tests/test_live.py)
