[pytest]
# Put the repo root on sys.path so `import finvizfinance` works under a bare
# `pytest` invocation (CI runs `pytest test`). Previously this was provided
# implicitly by an empty test/__init__.py; the offline harness makes test/ a
# non-package (so `from conftest import ...` resolves), so set it explicitly.
pythonpath = .
testpaths = test
markers =
    live: real-network test against finviz; skipped unless --run-live or RUN_LIVE=1 (see test/test_live.py)
